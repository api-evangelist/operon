aid: operon
name: Operon
description: >-
  Operon is an AI-powered manufacturing intelligence platform (Y Combinator
  S2026) that turns P&IDs (Piping & Instrumentation Diagrams), schematics,
  datasheets, and scanned engineering documents into one structured, queryable
  model of a plant. Its P&ID Recognition detects equipment, instruments, valves,
  and piping symbols across ISA, ISO, and proprietary symbology; its P&ID Agent
  generates standards-compliant diagrams from text, simulation data, or sketches;
  and Knowledge Chat lets engineers query plant documentation in natural language
  and build agentic workflows for safety, compliance, HAZOP/PHA, EHS, material
  take-offs, brownfield digitization, and management-of-change. Operon exports
  structured DEXPI data and offers cloud and on-premise deployment with
  encryption, role-based access control, and audit trails. As of July 2026 the
  product is in private beta (pid.operonsolutions.com) and publishes no public API.
